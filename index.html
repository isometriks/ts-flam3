<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app">
        <div id="sidebar">
          <div class="control-group">
            <label>Gamma <span id="gamma-value">1.6</span></label>
            <input type="range" id="gamma" min="0.1" max="5" step="0.1" value="1.6">
          </div>
          <div class="control-group">
            <label>Brightness <span id="brightness-value">1</span></label>
            <input type="range" id="brightness" min="0.1" max="10" step="0.1" value="1">
          </div>
          <div class="control-group">
            <label>Vibrancy <span id="vibrancy-value">1</span></label>
            <input type="range" id="vibrancy" min="0" max="1" step="0.05" value="1">
          </div>
          <div class="button-group">
            <button id="rotate-minus-btn">-</button>
            <span class="button-label">Rotate</span>
            <button id="rotate-plus-btn">+</button>
          </div>
          <button id="pause-btn">Pause</button>
          <button id="render-de-btn">Render with DE</button>
          <button id="randomize-palette-btn">Randomize Palette</button>
          <button id="new-flame-btn">New Flame</button>
          <div id="status">Sampling...</div>
        </div>
        <div id="canvas-container">
          <canvas id="canvas" width="500" height="500"></canvas>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
